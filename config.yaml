# AI 与数据日报：密钥从环境变量读取。
rsshub_base: https://rsshub.app
ai:
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  api_key_env: LLM_API_KEY
  temperature: 0.3
  batch_size: 5
  request_interval_seconds: 2
  analysis_cache_dir: output/analysis_cache
filtering:
  editorial_review: true
  time_window_hours: 24
  score_threshold: 5.5
  max_per_track:
    ai: 12
    data: 8
  min_per_region: 2
  supplement_window_hours: 48
  supplement_max_per_track: 2
  supplement_score_threshold: 6.5
sources:
  ai:
  - name: IT之家
    url: https://www.ithome.com/rss/
    region: cn
    max_items: 40
    priority_keywords: AI|人工智能|大模型|智能体|数据|数据库|开源|训练|推理|隐私|安全|DeepSeek|GLM|GPT|Claude|Gemini|Qwen|千问|豆包
  - name: 爱范儿
    url: https://www.ifanr.com/feed
    region: cn
    max_items: 25
  - name: 雷峰网
    url: https://www.leiphone.com/feed
    region: cn
    max_items: 25
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    region: global
    max_items: 25
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    region: global
    kind: official
    max_items: 25
  - name: Hugging Face
    url: https://huggingface.co/blog/feed.xml
    region: global
    kind: official
    max_items: 25
  - name: 钛媒体
    url: https://www.tmtpost.com/rss.xml
    region: cn
    max_items: 25
  data:
  - name: 国家数据局
    url: https://www.nda.gov.cn/sjj/swdt/list/index_pc_1.html
    region: cn
    kind: official
    type: html
    selector: li
    link_pattern: /sjj/.+_pc\.html$
    timezone_hours: 8
    max_articles: 40
    max_items: 25
  - name: Databricks
    url: https://www.databricks.com/blog
    region: global
    kind: official
    type: html
    selector: a[href*="/blog/"]
    link_pattern: /blog/(?!category/|author/)[^/]+$
    max_articles: 18
    max_items: 25
  - name: PingCAP
    url: https://www.pingcap.com/blog/feed/
    region: global
    kind: official
    max_items: 25
  - name: MongoDB
    url: https://www.mongodb.com/blog/rss
    region: global
    kind: official
    max_items: 25
  - name: InfoQ 中文
    url: https://www.infoq.cn/feed
    region: cn
    max_items: 25
  - name: 开源中国
    url: https://www.oschina.net/news/rss
    region: cn
    max_items: 30
    priority_keywords: 数据|数据库|AI|模型|向量|检索|隐私|安全|SQL|Spark|Flink|Kafka|Redis|ClickHouse|Doris
  - name: InfoQ 国际
    url: https://www.infoq.com/feed/
    region: global
    max_items: 25
  - name: Elastic
    url: https://www.elastic.co/blog/feed
    region: global
    kind: official
    max_items: 20
  - name: KDnuggets
    url: https://www.kdnuggets.com/feed
    region: global
    max_items: 15
email:
  enabled: true
  smtp_host: smtp.163.com
  smtp_port: 465
  smtp_user: ${SMTP_USER}
  from_name: TriBrief
  to:
  - 13099766355@163.com
  - cynthia_grass@163.com
output:
  dir: output
history:
  path: state/sent.json
  days: 14
